name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find source archive
        shell: bash
        run: |
          set -e

          ARCHIVE=""

          for f in \
            "不死鸟助手_定制源码.zip" \
            "FakeWalkerX2_悬浮摇杆优化源码.zip"
          do
            if [ -f "$f" ]; then
              ARCHIVE="$f"
              break
            fi
          done

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: No source ZIP found in repository root."
            echo "Please upload your source ZIP to the repository root."
            ls -la
            exit 1
          fi

          echo "SOURCE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "Using archive: $ARCHIVE"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          mkdir -p extracted
          unzip -q "$SOURCE_ARCHIVE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -150

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find extracted \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -type f
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root not found."
            echo "Expected settings.gradle and app/build.gradle."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "No Gradle Wrapper found; using Gradle 8.9."

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -o /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-debug-apk
          path: |
            extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
