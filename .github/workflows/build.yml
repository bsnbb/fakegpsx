name: FakeWalkerX APK Build

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK
    run: |
      sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract source
    run: |
      unzip -o "FakeWalkerX_Android源码初始版.zip" -d source
      find source -type f | head -80

  - name: Locate Gradle project
    run: |
      FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
      if [ -z "$FILE" ]; then
        echo "ERROR: settings.gradle not found"
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew assembleDebug
      else
        echo "Gradle wrapper not found"
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: FakeWalkerX-debug-apk
      path: source/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
