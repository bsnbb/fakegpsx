name: 不死鸟助手 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Locate and extract source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="不死鸟助手_定制源码.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: 找不到源码压缩包：$ARCHIVE"
            ls -lah
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ARCHIVE" -d extracted

          echo "===== 查找项目配置 ====="
          find extracted -maxdepth 5 -type f \
            \( -name settings.gradle.kts \
               -o -name settings.gradle \
               -o -name build.gradle.kts \
               -o -name gradlew \) \
            -print

          PROJECT_DIR=""

          while IFS= read -r settings; do
            DIR="$(dirname "$settings")"

            if [ -f "$DIR/androidApp/build.gradle.kts" ] && \
               [ -f "$DIR/gradlew" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name settings.gradle.kts \
                 -o -name settings.gradle \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: 未找到包含 androidApp 和 gradlew 的项目根目录"
            echo "请检查压缩包内部是否完整。"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "找到项目：$PROJECT_DIR"

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x gradlew

          ./gradlew :androidApp:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 不死鸟助手-debug-apk
          path: extracted/**/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
