name: FakeWalkerX APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      
      - name: Install Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android source
        run: |
          mkdir -p source
          unzip -o "FakeWalkerX_Android源码初始版.zip" -d source

      - name: Build APK
        run: |
          cd source
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeWalkerX-debug-apk
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
