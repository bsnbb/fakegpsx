name: FakeWalkerX APK 自动打包

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: 获取仓库源码
    uses: actions/checkout@v4

  - name: 配置 Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: 配置 Android SDK
    uses: android-actions/setup-android@v3

  - name: 安装 Android SDK 组件
    run: |
      sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: 解压 Android 工程
    run: |
      mkdir -p source
      unzip -o "FakeWalkerX_Android源码初始版.zip" -d source
      find source -maxdepth 4 -type f | head -100

  - name: 检查工程文件
    run: |
      SETTINGS_FILE=$(find source -name settings.gradle -o -name settings.gradle.kts | head -1)
      if [ -z "$SETTINGS_FILE" ]; then
        echo "错误：没有找到 settings.gradle 或 settings.gradle.kts"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$SETTINGS_FILE")
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "找到工程目录：$PROJECT_DIR"

  - name: 编译 Debug APK
    run: |
      cd "$PROJECT_DIR"
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
      else
        echo "没有 Gradle Wrapper，使用 Gradle 8.9 编译"
        gradle_version=8.9
        wget -q "https://services.gradle.org/distributions/gradle-${gradle_version}-bin.zip" -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /tmp
        /tmp/gradle-${gradle_version}/bin/gradle assembleDebug --stacktrace
      fi

  - name: 上传 APK
    uses: actions/upload-artifact@v4
    with:
      name: FakeWalkerX-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 7
