name: FakeWalkerX APK Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect project
        run: |
          echo "===== Root directory ====="
          ls -la
          echo "===== Gradle files ====="
          find . -maxdepth 5 -type f -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts"

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
