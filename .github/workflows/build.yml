name: FakeWalkerX APK 自动打包

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 获取仓库源码
        uses: actions/checkout@v4

      - name: 2. 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. 配置 Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 4. 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. 安装 Android 35 SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 6. 解压 Android 工程
        run: |
          mkdir -p source
          unzip -o "FakeWalkerX_Android源码初始版.zip" -d source
          test -f source/settings.gradle
          test -f source/app/build.gradle

      - name: 7. 编译 Debug APK
        run: |
          gradle -p source assembleDebug --stacktrace

      - name: 8. 检查 APK
        run: |
          test -f source/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/app/build/outputs/apk/debug/app-debug.apk

      - name: 9. 上传 APK 下载文件
        uses: actions/upload-artifact@v4
        with:
          name: FakeWalkerX-debug-apk
          path: source/app/build
