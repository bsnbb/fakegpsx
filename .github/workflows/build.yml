name: FakeWalkerX 2 Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          # sdkmanager may exit after accepting licenses, causing `yes` to receive SIGPIPE.
          # Temporarily disable pipefail for this pipeline so that harmless Broken pipe
          # from `yes` does not fail the workflow.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check source archive
        shell: bash
        run: |
          test -f "FakeWalkerX2_悬浮摇杆优化源码.zip"
          unzip -l "FakeWalkerX2_悬浮摇杆优化源码.zip" | head -40

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q "FakeWalkerX2_悬浮摇杆优化源码.zip" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

          # Support both ZIP layouts: files directly under extracted/ or inside FakeWalkerX2/.
          if [ -f extracted/settings.gradle ] && [ -f extracted/app/build.gradle ]; then
            PROJECT_DIR="extracted"
          elif [ -f extracted/FakeWalkerX2/settings.gradle ] && [ -f extracted/FakeWalkerX2/app/build.gradle ]; then
            PROJECT_DIR="extracted/FakeWalkerX2"
          else
            echo "Could not locate the Android project root."
            find extracted -name settings.gradle -o -name settings.gradle.kts
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle --project-dir "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeWalkerX2-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
