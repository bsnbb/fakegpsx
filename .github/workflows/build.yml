name: FakeWalkerX 2 Build

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
with:
  packages: 'platform-tools'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Check source archive
        shell: bash
        run: |
          test -f "FakeWalkerX2_全新项目源码-1.zip"
          unzip -l "FakeWalkerX2_全新项目源码-1.zip" | head -40

      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p extracted
          unzip -q "FakeWalkerX2_全新项目源码-1.zip" -d extracted
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -80
          test -f extracted/FakeWalkerX2/settings.gradle
          test -f extracted/FakeWalkerX2/app/build.gradle

      - name: Build debug APK
        run: gradle --project-dir extracted/FakeWalkerX2 assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FakeWalkerX2-debug-apk
          path: extracted/FakeWalkerX2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
